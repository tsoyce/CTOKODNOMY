name: Verify live site (manual)
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Public HTTPS origin
        required: true
        type: string
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the public site in a browser
        env:
          SITE_ORIGIN: ${{ inputs.origin }}
        run: node scripts/verify-live.mjs
