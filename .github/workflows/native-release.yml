name: Build BrainyCP release (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctokodnomy
          POSTGRES_PASSWORD: ctokodnomy
          POSTGRES_DB: ctokodnomy_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ctokodnomy -d ctokodnomy_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ctokodnomy:ctokodnomy@127.0.0.1:5432/ctokodnomy_test
      DATABASE_URL_TEST: postgresql://ctokodnomy:ctokodnomy@127.0.0.1:5432/ctokodnomy_test
      APP_ORIGIN: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: 3000
      MEDIA_DIR: ${{ runner.temp }}/ctokodnomy-uploads
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/package-native.mjs
      - name: Record the checked commit
        run: printf '%s\n' "$GITHUB_SHA" > dist/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ctokodnomy-native
          path: |
            dist/ctokodnomy-native.tar.gz
            dist/ctokodnomy-native.tar.gz.sha256
            dist/COMMIT.txt
          if-no-files-found: error
          retention-days: 30
