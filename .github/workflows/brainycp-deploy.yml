name: Deploy BrainyCP (manual)

on:
  workflow_dispatch:
    inputs:
      server:
        description: SSH server hostname or IP
        required: true
        type: string
      ssh_user:
        description: SSH user with permission to manage this application service
        required: true
        default: root
        type: string
      app_root:
        description: Existing application directory
        required: true
        type: string
      app_user:
        description: Unix application user
        required: true
        type: string
      port:
        description: Port of the existing nodejs instance service
        required: true
        type: string
      domain:
        description: Application hostname without a scheme
        required: true
        type: string
      known_hosts:
        description: Verified public known_hosts entry (optional if secret is configured)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: brainycp-deploy-${{ inputs.server }}-${{ inputs.port }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ctokodnomy
          POSTGRES_PASSWORD: ctokodnomy
          POSTGRES_DB: ctokodnomy_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ctokodnomy -d ctokodnomy_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ctokodnomy:ctokodnomy@127.0.0.1:5432/ctokodnomy_test
      DATABASE_URL_TEST: postgresql://ctokodnomy:ctokodnomy@127.0.0.1:5432/ctokodnomy_test
      APP_ORIGIN: http://127.0.0.1:3000
      HOST: 127.0.0.1
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          MEDIA_DIR: ${{ runner.temp }}/ctokodnomy-test-uploads
      - run: node scripts/package-native.mjs
      - name: Install and verify this application
        env:
          DEPLOY_HOST: ${{ inputs.server }}
          DEPLOY_USER: ${{ inputs.ssh_user }}
          APP_ROOT: ${{ inputs.app_root }}
          APP_USER: ${{ inputs.app_user }}
          APP_PORT: ${{ inputs.port }}
          APP_DOMAIN: ${{ inputs.domain }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSPHRASE: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ inputs.known_hosts || secrets.SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy-brainycp-ssh.sh
